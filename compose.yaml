x-environment:
  &default-back-environment

  # Database settings
  POSTGRES_DB: "moira"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

services:
  moira-nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      moira-php:
        condition: service_started

  moira-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      moira-db:
        condition: service_healthy

  moira-node:
    image: node:24.18.1-alpine
    working_dir: /var/www/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/var/www/frontend
      - ./docker/node/entrypoint.dev.sh:/usr/local/bin/node-entrypoint-dev:ro
      - frontend_node_modules:/var/www/frontend/node_modules
    entrypoint: ["/bin/sh", "/usr/local/bin/node-entrypoint-dev"]
    depends_on:
      - moira-nginx

  moira-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 15s
      retries: 10
      start_period: 5s

volumes:
  backend_vendor:
  frontend_node_modules:
  postgres_data: