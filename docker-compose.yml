services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - application-network
    depends_on:
      php:
        condition: service_started
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    volumes:
      - .:/var/www/html
      - ./docker/php/dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
    networks:
      - application-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  node:
    image: node:24.18.1-alpine
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - ./docker/node/entrypoint.dev.sh:/usr/local/bin/node-entrypoint-dev:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/node-entrypoint-dev"]
    networks:
      - application-network
    depends_on:
      - nginx
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    working_dir: /var/lib/postgresql
    ports:
      - "5432:5432"
    volumes:
      - /database/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 15s
      retries: 10
      start_period: 5s
    networks:
      - application-network
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 15s
      retries: 10
    networks:
      - application-network
    restart: unless-stopped

networks:
  application-network:
    driver: bridge

volumes:
  redis_data: